spring:
  datasource:
    url: ${RAG_DATABASE_URL:jdbc:postgresql://localhost:5432/arxiv_rag}
    username: ${RAG_DATABASE_USERNAME:arxiv_rag}
    password: ${RAG_DATABASE_PASSWORD:arxiv_rag}
  jpa:
    show-sql: false

rag:
  runtime:
    profile: foundry
  features:
    import-enabled: true
    papers-enabled: true
    search-enabled: true
    chat-enabled: true
    vector-stores-enabled: true
    benchmarks-enabled: ${RAG_BENCHMARKS_UI_ENABLED:true}

foundry:
  endpoint: ${AZURE_AI_FOUNDRY_ENDPOINT:https://models-for-peter-resource.services.ai.azure.com}
  api-key: ${AZURE_AI_FOUNDRY_API_KEY:}
  authentication-mode: ${AZURE_AI_FOUNDRY_AUTHENTICATION_MODE:api-key}
  token-scope: ${AZURE_AI_FOUNDRY_TOKEN_SCOPE:https://ai.azure.com/.default}
  api-version: ${AZURE_AI_FOUNDRY_API_VERSION:2024-10-21}
  chat-deployment: ${AZURE_AI_FOUNDRY_CHAT_DEPLOYMENT:gpt-5.6-luna}
  candidate-chat-deployment: ${AZURE_AI_FOUNDRY_CANDIDATE_CHAT_DEPLOYMENT:}
  embedding-deployment: ${AZURE_AI_FOUNDRY_EMBEDDING_DEPLOYMENT:text-embedding-3-large}
  request-timeout: ${AZURE_AI_FOUNDRY_REQUEST_TIMEOUT:120s}
  max-requests-per-minute: ${FOUNDRY_MAX_REQUESTS_PER_MINUTE:150}
  max-tokens-per-minute: ${FOUNDRY_MAX_TOKENS_PER_MINUTE:150000}
  chat-max-requests-per-minute: ${FOUNDRY_CHAT_MAX_REQUESTS_PER_MINUTE:${FOUNDRY_MAX_REQUESTS_PER_MINUTE:150}}
  chat-max-tokens-per-minute: ${FOUNDRY_CHAT_MAX_TOKENS_PER_MINUTE:${FOUNDRY_MAX_TOKENS_PER_MINUTE:150000}}
  embedding-max-requests-per-minute: ${FOUNDRY_EMBEDDING_MAX_REQUESTS_PER_MINUTE:${FOUNDRY_MAX_REQUESTS_PER_MINUTE:150}}
  embedding-max-tokens-per-minute: ${FOUNDRY_EMBEDDING_MAX_TOKENS_PER_MINUTE:${FOUNDRY_MAX_TOKENS_PER_MINUTE:150000}}
  max-retries: ${FOUNDRY_MAX_RETRIES:3}
  chat-max-retries: ${FOUNDRY_CHAT_MAX_RETRIES:1}
  query-embedding-max-retries: ${FOUNDRY_QUERY_EMBEDDING_MAX_RETRIES:1}
  interactive-reserved-requests-per-minute: ${FOUNDRY_INTERACTIVE_RESERVED_RPM:10}
  interactive-reserved-tokens-per-minute: ${FOUNDRY_INTERACTIVE_RESERVED_TPM:10000}
  chat-max-quota-wait: ${FOUNDRY_CHAT_MAX_QUOTA_WAIT:2s}
  query-embedding-max-quota-wait: ${FOUNDRY_QUERY_EMBEDDING_MAX_QUOTA_WAIT:2s}
  ingestion-embedding-max-quota-wait: ${FOUNDRY_INGESTION_EMBEDDING_MAX_QUOTA_WAIT:60s}
  retry-initial-backoff: ${FOUNDRY_RETRY_INITIAL_BACKOFF:1s}
  retry-max-backoff: ${FOUNDRY_RETRY_MAX_BACKOFF:10s}

embedding:
  ingestion:
    batch-size: ${FOUNDRY_EMBEDDING_BATCH_SIZE:20}
    model-name: ${AZURE_AI_FOUNDRY_EMBEDDING_DEPLOYMENT:text-embedding-3-large}
    dimensions: ${FOUNDRY_EMBEDDING_DIMENSIONS:1536}
    progress-log-interval: ${FOUNDRY_EMBEDDING_PROGRESS_LOG_INTERVAL:10}
    provider-batch-size: ${FOUNDRY_EMBEDDING_PROVIDER_BATCH_SIZE:32}
    provider-max-estimated-tokens: ${FOUNDRY_EMBEDDING_PROVIDER_MAX_ESTIMATED_TOKENS:100000}
    provider-max-estimated-document-tokens: ${FOUNDRY_EMBEDDING_PROVIDER_MAX_ESTIMATED_DOCUMENT_TOKENS:7000}

vector:
  store:
    type: pgvector

chat:
  orchestration-mode: ${RAG_CHAT_ORCHESTRATION_MODE:pre-retrieval}
  max-tool-rounds: ${RAG_CHAT_MAX_TOOL_ROUNDS:1}
  retrieval-top-k: ${RAG_CHAT_RETRIEVAL_TOP_K:4}
  max-context-characters-per-paper: ${RAG_CHAT_MAX_CONTEXT_PER_PAPER:800}
  max-context-characters-total: ${RAG_CHAT_MAX_CONTEXT_TOTAL:4000}
  max-completion-tokens: ${RAG_CHAT_MAX_COMPLETION_TOKENS:400}
  streaming-enabled: ${RAG_CHAT_STREAMING_ENABLED:true}
  streaming-timeout: ${RAG_CHAT_STREAMING_TIMEOUT:90s}
  request-deadline: ${RAG_CHAT_REQUEST_DEADLINE:90s}
  cache-enabled: ${RAG_CHAT_CACHE_ENABLED:true}
  cache-ttl: ${RAG_CHAT_CACHE_TTL:10m}
  negative-cache-ttl: ${RAG_CHAT_NEGATIVE_CACHE_TTL:45s}
  cache-maximum-size: ${RAG_CHAT_CACHE_MAXIMUM_SIZE:1000}
  retrieval-policy-version: ${RAG_CHAT_RETRIEVAL_POLICY_VERSION:retrieval-v1}
  prompt-version: ${RAG_CHAT_PROMPT_VERSION:grounded-v1}
  reasoning-effort: ${RAG_CHAT_REASONING_EFFORT:none}
  provider-prompt-cache-enabled: ${RAG_CHAT_PROVIDER_PROMPT_CACHE_ENABLED:false}
  answer-cache-enabled: ${RAG_CHAT_ANSWER_CACHE_ENABLED:false}
  answer-cache-ttl: ${RAG_CHAT_ANSWER_CACHE_TTL:5m}
  answer-cache-maximum-size: ${RAG_CHAT_ANSWER_CACHE_MAXIMUM_SIZE:250}
  max-parallel-tool-calls: ${RAG_CHAT_MAX_PARALLEL_TOOL_CALLS:3}
  debug-timings: ${RAG_CHAT_DEBUG_TIMINGS:false}
  benchmark-input-price-per-million-tokens: ${RAG_CHAT_BENCHMARK_INPUT_PRICE_PER_MILLION:}
  benchmark-cached-input-price-per-million-tokens: ${RAG_CHAT_BENCHMARK_CACHED_INPUT_PRICE_PER_MILLION:}
  benchmark-output-price-per-million-tokens: ${RAG_CHAT_BENCHMARK_OUTPUT_PRICE_PER_MILLION:}
