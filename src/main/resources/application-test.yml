spring:
  datasource:
    url: jdbc:h2:mem:arxiv_rag_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    show-sql: false

rag:
  runtime:
    profile: test
  features:
    import-enabled: false
    papers-enabled: false
    search-enabled: false
    chat-enabled: false
    vector-stores-enabled: false
    benchmarks-enabled: false

arxiv:
  import:
    max-records: 500
    batch-size: 2

embedding:
  ingestion:
    batch-size: 2

vector:
  store:
    type: in-memory
