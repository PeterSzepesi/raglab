spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/arxiv_rag
    username: arxiv_rag
    password: arxiv_rag
  jpa:
    show-sql: false

rag:
  runtime:
    profile: dev
  features:
    import-enabled: true
    papers-enabled: true
    search-enabled: true
    chat-enabled: false
    vector-stores-enabled: true
    benchmarks-enabled: false

vector:
  store:
    type: pgvector
