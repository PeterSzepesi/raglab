spring:
  application:
    name: arxiv-rag
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

rag:
  runtime:
    profile: local
  features:
    import-enabled: false
    papers-enabled: false
    search-enabled: false
    chat-enabled: false
    vector-stores-enabled: false
    benchmarks-enabled: false

arxiv:
  import:
    categories:
      - cs.CL
      - cs.AI
      - cs.LG
      - cs.CV
    from-date: 2022-01-01
    max-records: 50000
    batch-size: 1000
    malformed-record-policy: warn-and-skip

embedding:
  ingestion:
    batch-size: 100
    model-name: offline-deterministic-1536
    dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        include: health,info
