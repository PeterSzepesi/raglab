spring:
  application:
    name: arxiv-rag
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  address: ${RAG_SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful

rag:
  runtime:
    profile: local
  admin:
    local-only: ${RAG_ADMIN_LOCAL_ONLY:true}
    token: ${RAG_ADMIN_TOKEN:}
  execution:
    max-concurrent-chats: ${RAG_MAX_CONCURRENT_CHATS:16}
    max-concurrent-retrievals: ${RAG_MAX_CONCURRENT_RETRIEVALS:32}
    admission-wait: ${RAG_ADMISSION_WAIT:100ms}
    semantic-search-timeout: ${RAG_SEMANTIC_SEARCH_TIMEOUT:2s}
  features:
    import-enabled: false
    papers-enabled: false
    search-enabled: false
    chat-enabled: false
    vector-stores-enabled: false
    benchmarks-enabled: false

arxiv:
  import:
    categories:
      - cs.CL
      - cs.AI
      - cs.LG
      - cs.CV
    from-date: 2022-01-01
    max-records: 50000
    batch-size: 1000
    malformed-record-policy: warn-and-skip

embedding:
  ingestion:
    batch-size: 100
    model-name: offline-deterministic-1536
    dimensions: 1536
    progress-log-interval: 10
    provider-batch-size: 32
    provider-max-estimated-tokens: 100000
    provider-max-estimated-document-tokens: 7000

search:
  cache:
    enabled: ${RAG_QUERY_CACHE_ENABLED:true}
    query-embedding-ttl: ${RAG_QUERY_CACHE_TTL:10m}
    query-embedding-maximum-size: ${RAG_QUERY_CACHE_MAXIMUM_SIZE:1000}
  retrieval:
    hybrid-vector-weight: ${RAG_HYBRID_VECTOR_WEIGHT:0.7}
    hybrid-lexical-weight: ${RAG_HYBRID_LEXICAL_WEIGHT:0.3}
    semantic-minimum-similarity: ${RAG_SEMANTIC_MINIMUM_SIMILARITY:0.0}
    hybrid-minimum-score: ${RAG_HYBRID_MINIMUM_SCORE:0.0}
    duplicate-title-jaccard-threshold: ${RAG_DUPLICATE_TITLE_THRESHOLD:0.8}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,pgVector
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        rag.chat.latency: true
        rag.chat.ttft: true
        rag.chat.stage.latency: true
        rag.search.latency: true
        rag.search.stage.latency: true
        rag.foundry.latency: true
        rag.foundry.quota.wait: true
  tracing:
    sampling:
      probability: ${RAG_TRACING_SAMPLE_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
