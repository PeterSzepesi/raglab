openapi: 3.1.0
info:
  title: arXiv RAG Lab API
  version: 1.0.0
  description: Versioned local API. Legacy `/api/...` aliases remain temporarily available.
servers:
  - url: http://127.0.0.1:8080/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Return passive dependency, corpus, cache, and admission state
      responses:
        '200':
          description: Current health snapshot; degraded dependencies are represented in the body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Return safe runtime facts and enabled capabilities
      responses:
        '200':
          description: Safe configuration with no credential values
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /search:
    post:
      operationId: searchPapers
      summary: Search the indexed corpus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            examples:
              automatic:
                value: { query: retrieval augmented generation, mode: auto, topK: 5, category: cs.AI }
      responses:
        '200':
          description: Ranked canonical papers and retrieval diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
        '504': { $ref: '#/components/responses/ProviderDeadline' }
  /chat:
    post:
      operationId: groundedChat
      summary: Generate one grounded answer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            examples:
              paperQuestion:
                value: { message: Summarize arXiv 2401.00001., retrievalMode: auto }
      responses:
        '200':
          description: Grounded answer with authoritative citation links
          headers:
            X-Request-ID: { schema: { type: string } }
            Server-Timing: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/CapacityExceeded' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
        '504': { $ref: '#/components/responses/ProviderDeadline' }
  /chat/stream:
    post:
      operationId: streamGroundedChat
      summary: Stream a grounded answer as SSE
      description: See `docs/api/chat-sse.md` for event order and terminal behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/CapacityExceeded' }
  /papers:
    get:
      operationId: browsePapers
      summary: Cursor-page canonical papers
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: query, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
  /papers/{arxivId}:
    get:
      operationId: getPaper
      summary: Get canonical paper and embedding state
      parameters:
        - { name: arxivId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Paper
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paper' }
        '404': { $ref: '#/components/responses/NotFound' }
  /embeddings/status:
    get:
      operationId: getEmbeddingStatus
      summary: Return coverage, active version, job, and index diagnostics
      responses:
        '200':
          description: Embedding/index status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /embeddings/jobs:
    get:
      operationId: listEmbeddingJobs
      summary: List recent durable embedding jobs
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
    post:
      operationId: startEmbeddingJob
      summary: Start bounded changed-document embedding
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { maxPapers: { type: integer, minimum: 1 }, dryRun: { type: boolean } } }
      responses:
        '200': { description: Accepted durable job identifier }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /embeddings/jobs/{jobId}/resume:
    post:
      operationId: resumeEmbeddingJob
      security: [{ AdminToken: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Resumed job identifier }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /embeddings/jobs/{jobId}:
    delete:
      operationId: cancelEmbeddingJob
      security: [{ AdminToken: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cancellation request state }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/preview:
    post:
      operationId: previewImport
      summary: Scan an import without database writes
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200': { description: Read/accepted/filtered/invalid/duplicate/existing counts }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/jobs:
    get:
      operationId: listImportJobs
      security: [{ AdminToken: [] }]
      responses:
        '200': { description: Recent durable import jobs }
    post:
      operationId: startImportJob
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200': { description: Durable import job }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/uploads:
    post:
      operationId: uploadImport
      summary: Upload at most 25 MiB and start a durable import
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                categories: { type: array, items: { type: string } }
                fromDate: { type: string, format: date }
                maxRecords: { type: integer, minimum: 1, maximum: 1000000 }
      responses:
        '200': { description: Durable import job }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /benchmarks:
    get:
      operationId: listBenchmarkReports
      summary: List persisted benchmark JSON reports
      responses:
        '200': { description: Reports }
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Optional local admin token; when absent, mutation routes are loopback-only.
  schemas:
    SearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 8000 }
        mode: { type: string, enum: [auto, lexical, semantic, vector, hybrid], default: auto }
        topK: { type: integer, minimum: 1, maximum: 50, default: 10 }
        category: { type: [string, 'null'], maxLength: 64 }
        fromDate: { type: [string, 'null'], format: date }
        toDate: { type: [string, 'null'], format: date }
    SearchResponse:
      type: object
      required: [query, topK, embeddingModel, results, mode, diagnostics]
      properties:
        query: { type: string }
        topK: { type: integer }
        embeddingModel: { type: string }
        mode: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        diagnostics: { type: object, additionalProperties: true }
    SearchResult:
      type: object
      required: [paperId, arxivId, title, score]
      properties:
        paperId: { type: integer, format: int64 }
        arxivId: { type: string }
        title: { type: string }
        abstractText: { type: string }
        authors: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        submittedDate: { type: [string, 'null'], format: date }
        score: { type: number }
        retrievalText: { type: string }
    ChatRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 8000 }
        retrievalMode: { type: [string, 'null'], enum: [auto, lexical, semantic, vector, hybrid, null] }
        category: { type: [string, 'null'], maxLength: 64 }
        fromDate: { type: [string, 'null'], format: date }
        toDate: { type: [string, 'null'], format: date }
        agentic: { type: [boolean, 'null'] }
    ChatResponse:
      type: object
      required: [answer, model, citations, toolsUsed, groundingStatus, cacheStatus]
      properties:
        answer: { type: string }
        model: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        toolsUsed: { type: array, items: { type: string } }
        groundingStatus: { type: string, enum: [GROUNDED, NO_EVIDENCE, PAPER_NOT_FOUND, DEGRADED_LEXICAL] }
        cacheStatus: { type: string, enum: [HIT, MISS, BYPASS] }
    Citation:
      type: object
      required: [paperId, arxivId, title, score, url]
      properties:
        paperId: { type: integer, format: int64 }
        arxivId: { type: string }
        title: { type: string }
        score: { type: number }
        url: { type: string, format: uri, pattern: '^https://arxiv\\.org/abs/' }
    Paper:
      type: object
      additionalProperties: true
      required: [id, arxivId, title, abstractUrl, pdfUrl, embeddingStatus, contentHash]
      properties:
        id: { type: integer, format: int64 }
        arxivId: { type: string }
        title: { type: string }
        abstractUrl: { type: string, format: uri }
        pdfUrl: { type: string, format: uri }
        embeddingStatus: { type: string, enum: [CURRENT, STALE, MISSING] }
        contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    ImportRequest:
      type: object
      required: [sourcePath]
      additionalProperties: false
      properties:
        sourcePath: { type: string, minLength: 1 }
        categories: { type: array, items: { type: string } }
        fromDate: { type: [string, 'null'], format: date }
        maxRecords: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
    Health:
      type: object
      additionalProperties: true
      required: [status, applicationName, checkedAt, database, vectorStore, provider, corpus, admission, caches]
      properties:
        status: { type: string, enum: [UP, DEGRADED, DOWN] }
        applicationName: { type: string }
        checkedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, code, retryable, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        retryable: { type: boolean }
        requestId: { type: string }
        providerRequestId: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Administrative access required
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Operation conflicts with current state
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CapacityExceeded:
      description: Local admission or provider quota is full
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProviderUnavailable:
      description: Model provider unavailable
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProviderDeadline:
      description: Provider deadline exceeded
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
